defaults:
  api_url: "http://127.0.0.1:8131"
  model: "gpt-4"
  rpm: 300
  prompt:
    system: "Solve the math problem step by step. Final answer after ####."
    user: "{question}"
  generation:
    max_tokens: 128
  output_field: "solution"
tasks:
  gsm8k:
    generation:
      scheme: "sample"
      temperature: 0.7
    evaluation:
      type: "exact_match"
      answer_field: "answer"
      extract: "last_number"
    num_solutions: 3
