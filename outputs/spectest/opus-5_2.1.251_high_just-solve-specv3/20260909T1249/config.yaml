agent:
  binary: claude
  cost_limits:
    cost_limit: 20
    max_retries: 10
    net_cost_limit: 100
    step_limit: 0
  disallowed_tools:
  - Monitor
  env:
    CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
  permission_mode: bypassPermissions
  timeout: 86400
  type: claude_code
  version: 2.1.251
agent_config_path: /home/carver/code/claudedev/unslop-code-bench/configs/agents/claude_code-2.1.251.yaml
environment:
  commands:
    agent_command: python
    command: uv run
    entry_file: '{entry_file}.py'
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    mount_workspace: true
    workdir: /workspace
  environment:
    env:
      PIP_CACHE_DIR: /tmp/pip-cache-dir
      PIP_CONFIG_FILE: /tmp/pip-conf
      UV_CACHE_DIR: /tmp/uv-cache
  name: python3.12
  setup:
    eval_commands:
    - uv init
    - uv add -r requirements.txt
    resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
  type: docker
environment_config_path: /home/carver/code/claudedev/unslop-code-bench/slop-code-bench/configs/environments/docker-python3.12-uv.yaml
model:
  name: opus-5
  provider: claude_code_oauth
one_shot:
  enabled: false
  include_first_prefix: false
  prefix: ''
output_path: /home/carver/code/claudedev/unslop-code-bench/outputs/spectest/opus-5_2.1.251_high_just-solve-specv3/20260909T1249
pass_policy: any
problems:
- xjq
prompt_content: 'Implement a program that 100% solves the specification. That is all
  you need to do.

  {% if not is_continuation -%}

  Use a virtual environment and ensure that a `requirements.txt` is present with any
  dependencies you need to solve the problem.

  {% else -%}

  Keep using the same virtual environment you started with, update `requirements.txt`
  with any new dependencies you need.

  {% endif -%}


  Your task is:

  {{ spec.strip() }}

  '
prompt_path: /home/carver/code/claudedev/unslop-code-bench/slop-code-bench/configs/prompts/just-solve.jinja
save_dir: /home/carver/code/claudedev/unslop-code-bench/outputs
save_template: spectest/opus-5_2.1.251_high_just-solve-specv3/20260909T1249
thinking: high
thinking_max_tokens: null
