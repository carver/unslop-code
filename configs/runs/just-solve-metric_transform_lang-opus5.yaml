# just-solve on metric_transform_lang, against the cached spec (v0). Written by bin/run-config.
# Same agent, model and thinking as every spectest run. Paths are relative to the repo
# root, which bin/queue and bin/scb-extend run from.
#
#   bin/scb-extend --new configs/runs/just-solve-metric_transform_lang-opus5.yaml metric_transform_lang 5
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: just-solve
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - metric_transform_lang
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_just-solve/${now:%Y%m%dT%H%M}
