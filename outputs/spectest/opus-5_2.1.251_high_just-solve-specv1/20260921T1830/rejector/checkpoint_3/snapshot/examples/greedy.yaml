task:
  name: "math_solve"
  api_url: "http://localhost:8000"
  model: "gpt-4"
  rpm: 60
  prompt:
    system: "Solve the math problem. Final answer after ####."
    user: "{question}"
  generation:
    scheme: "greedy"
    max_tokens: 256
  evaluation:
    type: "exact_match"
    answer_field: "answer"
    extract: "last_number"
  output_field: "solution"
