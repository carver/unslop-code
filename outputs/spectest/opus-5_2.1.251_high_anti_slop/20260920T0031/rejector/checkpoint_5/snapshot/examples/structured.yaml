task:
  name: "code_gen"
  api_url: "http://localhost:8000"
  model: "gpt-4"

  rate_limits:
    rpm: 100
    tpm: 50000
    max_concurrent: 10

  cost:
    prompt_cost_per_1k: 0.01
    completion_cost_per_1k: 0.03
    budget: 50.0

  prompt:
    system: "Answer with a JSON object holding a 'code' and an 'explanation' field."
    user: "{problem}"

  generation:
    scheme: "rejection"
    temperature: 0.7
    n: 3
    max_tokens: 512

  output_schema:
    type: "object"
    required: ["code", "explanation"]
    properties:
      code:
        type: "string"
      explanation:
        type: "string"

  output_field: "solution"
