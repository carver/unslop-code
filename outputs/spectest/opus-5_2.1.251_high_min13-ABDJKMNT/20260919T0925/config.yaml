agent:
  binary: claude
  cost_limits:
    cost_limit: 20
    max_retries: 10
    net_cost_limit: 100
    step_limit: 0
  disallowed_tools:
  - Monitor
  env:
    CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
  permission_mode: bypassPermissions
  timeout: 86400
  type: claude_code
  version: 2.1.251
agent_config_path: configs/agents/claude_code-2.1.251.yaml
environment:
  commands:
    agent_command: python
    command: uv run
    entry_file: '{entry_file}.py'
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    mount_workspace: true
    workdir: /workspace
  environment:
    env:
      PIP_CACHE_DIR: /tmp/pip-cache-dir
      PIP_CONFIG_FILE: /tmp/pip-conf
      UV_CACHE_DIR: /tmp/uv-cache
  name: python3.12
  setup:
    eval_commands:
    - uv init
    - uv add -r requirements.txt
    resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
  type: docker
environment_config_path: /home/carver/code/claudedev/unslop-code-bench/harness/configs/environments/docker-python3.12-uv.yaml
model:
  name: opus-5
  provider: claude_code_oauth
one_shot:
  enabled: false
  include_first_prefix: false
  prefix: ''
output_path: outputs/spectest/opus-5_2.1.251_high_min13-ABDJKMNT/20260919T0925
pass_policy: any
problems:
- file_merger
prompt_content: "# Task Directions\n\nFully implement the following spec. Use the\
  \ approach:\n- Environment setup\n- Write tests from the spec\n- Implement\n- Declare\
  \ complete\n\nSpecifically:\n\n# Environment\n\n{% if not is_continuation -%}\n\
  Use a virtual environment and ensure that a `requirements.txt` is present with any\
  \ dependencies you need to solve the problem.\n{% else -%}\nKeep using the same\
  \ virtual environment you started with, update `requirements.txt` with any new dependencies\
  \ you need.\n{% endif -%}\n\nTouch an IN_PROGRESS file. Delete any COMPLETED file.\n\
  \nWhen killing a process never run a pkill. Instead, pgrep.\nMake sure only one\
  \ process is found, then kill that one by PID.\nWhy? It's too easy to pkill your\
  \ own Bash argv.\n\nFor long-lived processes, log to a file or /dev/null instead\
  \ of an undrained pipe.\n\n# Testing\n\nSplit the spec file into minimal possible\
  \ logical phrases and minimal context, and iterate through each phrase.\nFor each\
  \ phrase, add a test section with a comment of the phrase & context.\n\nIf the spec\
  \ is non-trivially under-specified, such that alternative interpretations would\
  \ change the behavior of a conforming implementation on some input, then never ask\
  \ for clarification.\nInstead, make your best choice at how to interpret the intention\
  \ of the spec.\nThen, add a numbered entry to an AMBIGUITIES.md file, starting with\
  \ T1.\nThe entry must have sections for Spec Text, Alternatives, Choice, and Risk.\n\
  The entry will quote the relevant spec source verbatim, explain the reasonable alternative\
  \ interpretations, and your choice & why it seems to best fit the spec.\nThe \"\
  ### Risk: N\" section\nRisk is a number from 0 to 100: the chance that the spec's\
  \ author, who has an implementation of their own and writes the hidden tests against\
  \ it, prefers a different reading from your choice on some tested input.\nReason\
  \ about what the author's implementation most likely does and what fixture they\
  \ would naturally write, not only about which reading the prose supports best.\n\
  If Risk is above 0, name the reading the author most likely prefers in one line.\n\
  Use the whole range: a flat number on every entry is useless.\n\nIf a previous ambiguity\
  \ is resolved by the current spec, annotate the entry instead of removing it.\n\n\
  You run tests only to validate the tests themselves: collection succeeds, helpers\
  \ and generators work{% if is_continuation -%}, and each failure is because behavior\
  \ is missing, not because the test is broken{% endif -%}. Quick, targeted runs.\n\
  \nNever run the full suite to completion or long hypothesis runs; a green suite\
  \ is the implementer's job, not yours.\n\n# Implement\n- Follow best coding practices:\n\
  \  - Group functions into files based on related functionality\n  - Keep your code\
  \ clean\n- No god functions/classes.\n- Make sure the code is documented appropriately\
  \ so that it is easy to pick up.\n- Minimize the following gotchas:\n  - Extra defensive\
  \ checks or try/catch blocks that are abnormal.\n  - Casts to get around type checking\n\
  \  - Variables that are only used a single time after declaration.\n  - Extra comments\
  \ that a human wouldn't add.\n  - Trivial wrappers\n  - Heavy nesting\n  - If/Else\
  \ ladders\n  - A ton of helper methods\n\n# Declare complete\n\ntouch a COMPLETED\
  \ file. rm the IN_PROGRESS file.\n\n# Spec\n{{ spec.strip() }}\n"
prompt_path: configs/prompts/min13-ABDJKMNT.jinja
save_dir: outputs
save_template: spectest/opus-5_2.1.251_high_min13-ABDJKMNT/20260919T0925
thinking: high
thinking_max_tokens: null
