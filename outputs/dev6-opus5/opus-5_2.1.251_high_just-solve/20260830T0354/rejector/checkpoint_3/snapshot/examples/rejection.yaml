task:
  name: "math_rejection"
  api_url: "http://localhost:8000"
  model: "gpt-4"
  rpm: 60
  prompt:
    system: "Solve the math problem. Put your final answer after ####."
    user: "{question}"
  generation:
    scheme: "rejection"
    temperature: 0.8
    max_tokens: 512
    n: 5
  evaluation:
    type: "exact_match"
    answer_field: "answer"
    extract: "last_number"
  output_field: "solution"
