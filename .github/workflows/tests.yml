# Runs the bin tool tests on every pull request and on pushes to main.
# The suite needs only pytest and pyyaml; tests/test_reeval.py skips itself
# without the slop-code venv, as it does on any machine that lacks it.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest
