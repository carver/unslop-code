# min10-ABDEFJKMNO-specv2 on datagate, against spec v2, specs/v2/ built by bin/spec-patch. Written by bin/run-config.
# Same agent, model and thinking as every spectest run.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/specs/datagate/v2/problems bin/scb-extend --new configs/runs/min10-ABDEFJKMNO-specv2-datagate-opus5.yaml datagate 7
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/min10-ABDEFJKMNO.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_min10-ABDEFJKMNO-specv2/${now:%Y%m%dT%H%M}
