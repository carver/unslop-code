defaults:
  api_url: "http://127.0.0.1:8121"
  model: "gpt-4"
  rpm: 120
  prompt:
    system: "Write a Python function to solve the problem. Output only the function code, no explanation."
    user: "{problem}"
  generation:
    scheme: "greedy"
tasks:
  code_gen:
    evaluation:
      type: "script"
      command_template: "{test_code}"
      success_exit_code: 0
    output_field: "code"
