task:
  name: "gsm8k_solve"
  api_url: "http://localhost:8000"
  model: "gpt-4"
  rpm: 60

  prompt:
    system: "Solve the math problem. Put your final answer after ####."
    user: "{question}"

  generation:
    scheme: "greedy"
    temperature: 0.0
    max_tokens: 512
    n: 1

  evaluation:
    type: "exact_match"
    answer_field: "answer"
    extract: "last_number"

  output_field: "solution"
