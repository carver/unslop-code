defaults:
  api_url: "http://localhost:8000"
  model: "gpt-4"
  rate_limits:
    rpm: 60
  generation:
    max_tokens: 512

tasks:
  gsm8k:
    prompt:
      system: "Solve the math problem step by step. Final answer after ####."
      user: "{question}"
    icl:
      setups:
        - name: "chain_of_thought"
          examples:
            - input: {question: "What is 2+2?"}
              output: "Let me think step by step.\n2 + 2 = 4\n#### 4"
            - input: {question: "If I have 3 cats and get 2 more, how many cats do I have?"}
              output: "Step by step:\nI start with 3 cats.\nI get 2 more.\n3 + 2 = 5\n#### 5"
        - name: "direct"
          examples:
            - input: {question: "What is 2+2?"}
              output: "#### 4"
            - input: {question: "If I have 3 cats and get 2 more, how many cats do I have?"}
              output: "#### 5"
      k: 2
      strategy: "round_robin"
    generation:
      scheme: "rejection"
      temperature: 0.7
      max_attempts: 15
    evaluation:
      type: "exact_match"
      answer_field: "answer"
      extract: "last_number"
    output_field: "solution"
    num_solutions: 5

  gsm8k_detailed:
    prompt:
      system: "Solve the math problem step by step. Final answer after ####."
      user: "{question}"
    icl:
      setups:
        - name: "detailed"
          file: "icl/gsm8k_detailed.jsonl"
      k: 3
      strategy: "fixed"
    generation:
      scheme: "sample"
      temperature: 0.8
    evaluation:
      type: "exact_match"
      answer_field: "answer"
      extract: "last_number"
    output_field: "solution"
    num_solutions: 3
