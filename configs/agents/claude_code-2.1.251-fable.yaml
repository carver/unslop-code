# Fable 5 variant of claude_code-2.1.251.yaml: identical except net_cost_limit, sized for
# Fable list prices (2x Opus): Opus spent $52 on sith, so $100 would likely bind mid-problem.
#
# Matches the paper's published setup: no turn cap, two-hour wall clock per checkpoint.
# How each limit actually behaves for the claude_code agent (agent.py, runner):
#   step_limit 0     -> no --max-turns flag. The dev6 control run of 2026-08-29 used the repo
#                       default of 100 and hit it on 4/33 checkpoints; see baseline-report.md.
#   timeout 7200     -> hard kill of the checkpoint's claude process. This is the real guard.
#   cost_limit       -> not enforced for claude_code (only other agents check it per checkpoint);
#                       kept at 20 so the value still documents the intended ceiling.
#   net_cost_limit   -> checked between checkpoints against the problem's cumulative cost; 200 keeps
#                       headroom above sith at Fable prices (~$104 if tokens match the Opus run). Protects the
#                       rate-limit window from a runaway problem without touching normal runs.
#                       (raised 60 -> 100 on 2026-08-30: Opus 5 spent $51.77 on sith)
type: claude_code
binary: claude
permission_mode: bypassPermissions
version: 2.1.251
timeout: 7200
cost_limits:
  cost_limit: 20
  step_limit: 0
  net_cost_limit: 200
