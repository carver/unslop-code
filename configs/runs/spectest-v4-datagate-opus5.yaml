# Spectest v4 prompt experiment: datagate only, Opus 5, advanced one checkpoint at a time.
# v4 (hand-written, cab08fe): the Testing section runs in a sub-agent judged on breadth, so
# test authorship is decoupled from implementation burden (the v2/v3 agents pre-narrowed their
# own generators). Error-expecting tests must quote the spec; generators must reach the
# smallest legal inputs.
#
#   start:    bin/scb run --config configs/runs/spectest-v4-datagate-opus5.yaml \
#               --no-live-progress --stop-after-checkpoint 1
#   continue: bin/scb run --resume <run_dir> --no-live-progress [--stop-after-checkpoint N]
agent: /home/carver/code/claudedev/unslop-code-bench/configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: /home/carver/code/claudedev/unslop-code-bench/configs/prompts/spectest-v4.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: /home/carver/code/claudedev/unslop-code-bench/outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
