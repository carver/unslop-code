# Spectest v7 prompt experiment: all 7 datagate checkpoints, Opus 5.
# v7 = v6 with numbered ambiguity entries (T1.. test-time, I1.. implementation-time),
# sentence-per-line for diffs, and the turn-ending note corrected for print mode's real
# wind-down rules: only a running sub-agent keeps the process alive after end-turn; a
# background command is killed 5s after the turn ends (ceiling env var does not apply to
# bash tasks), so commands must be waited on in the foreground.
# The v6 run this replaces scored ckpt1 50/50, ckpt2 119/122 before it was killed mid-ckpt3.
#
# A full 7-checkpoint run does not fit one 5h rate-limit window; expect to resume.
#
#   full run: bin/scb run --config configs/runs/spectest-v7-datagate-opus5.yaml --no-live-progress
#   resume:   bin/scb run --resume <run_dir> --no-live-progress   (--dry-run first after a crash)
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/spectest-v7.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
