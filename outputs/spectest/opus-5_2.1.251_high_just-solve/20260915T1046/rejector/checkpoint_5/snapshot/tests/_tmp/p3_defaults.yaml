defaults:
  api_url: "http://127.0.0.1:8131"
  model: "gpt-4"
  rpm: 300
  prompt:
    system: "Solve the math problem step by step. Final answer after ####."
    user: "{question}"
  num_solutions: 3
  icl:
    setups:
      - name: "direct"
        examples:
          - input: {question: "What is 2+2?"}
            output: "#### 4"
    strategy: "fixed"
  generation:
    scheme: "sample"
    temperature: 0.5
  evaluation:
    type: "exact_match"
    answer_field: "answer"
    extract: "last_number"
  output_field: "solution"
tasks:
  gsm8k: {}
  gsm8k_one:
    num_solutions: 1
    icl:
      setups:
        - name: "cot"
          examples:
            - input: {question: "What is 2+2?"}
              output: "2 + 2 = 4\n#### 4"
