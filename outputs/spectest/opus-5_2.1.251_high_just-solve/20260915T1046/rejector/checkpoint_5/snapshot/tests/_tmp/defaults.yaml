defaults:
  api_url: "http://127.0.0.1:8121"
  model: "gpt-4"
  rpm: 300
  prompt:
    system: "Solve the math problem step by step. Put your final answer after ####."
    user: "{question}"
  generation:
    scheme: "greedy"
    max_tokens: 128
  evaluation:
    type: "exact_match"
    answer_field: "answer"
    extract: "last_number"
  output_field: "solution"
tasks:
  gsm8k: {}
  gsm8k_hot:
    generation:
      scheme: "sample"
      temperature: 0.4
    output_field: "answer_text"
