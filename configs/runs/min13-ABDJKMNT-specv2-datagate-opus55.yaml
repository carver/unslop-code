# min13-ABDJKMNT-specv2 on datagate, against spec v2, specs/datagate/v2/ built by bin/spec-patch. Copied from the -opus5 config by hand.
# Opus 5.5 on Claude Code 2.1.280; prompt, spec and thinking as the -opus5 config. Paths are relative to the repo
# root, which bin/queue and bin/scb-extend run from.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/specs/datagate/v2/problems bin/scb-extend --new configs/runs/min13-ABDJKMNT-specv2-datagate-opus55.yaml datagate 7
agent: configs/agents/claude_code-2.1.280.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/min13-ABDJKMNT.jinja
model:
  provider: claude_code_oauth
  name: opus-5-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_min13-ABDJKMNT-specv2/${now:%Y%m%dT%H%M}
