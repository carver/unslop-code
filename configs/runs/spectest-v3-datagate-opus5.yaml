# Spectest v3 prompt experiment: datagate only, Opus 5, advanced one checkpoint at a time.
# v3 (hand-written, commit b4c57ff) = v2 plus the lesson from the v2 post-run Q&A: spec tests
# may not be changed, and a failing generated input is evidence the implementation misses the
# spec - never narrow a generator or test to dodge it (the v2 agent set headers(n_min=2) to
# silence its own single-column failures, which cost the core pass).
#
#   start:    bin/scb run --config configs/runs/spectest-v3-datagate-opus5.yaml \
#               --no-live-progress --stop-after-checkpoint 1
#   continue: bin/scb run --resume <run_dir> --no-live-progress [--stop-after-checkpoint N]
agent: /home/carver/code/claudedev/unslop-code-bench/configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: /home/carver/code/claudedev/unslop-code-bench/configs/prompts/spectest-v3.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: /home/carver/code/claudedev/unslop-code-bench/outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_${prompt}/${now:%Y%m%dT%H%M}
