# Just-solve on the DISAMBIGUATED datagate spec: the benchmark's own prompt against
# ~/.cache/scbench/problems/datagate with problems/datagate-clarified.patch applied.
# Same agent, model and thinking as the dev6-opus5 control and the spectest series.
# Isolates the spec patch from the spectest prompt: the control lost 28 tests on the
# unpatched spec; v8-disambiguated (prompt + patch) solved all 405.
#
# The patched copy must exist and be selected via the catalog's override variable:
#   cp -r ~/.cache/scbench/problems/datagate problems/datagate && patch -p1 -d problems < problems/datagate-clarified.patch
#   SCBENCH_PROBLEMS_PATH=$PWD/problems bin/scb-extend --new configs/runs/just-solve-disambiguated-datagate-opus5.yaml datagate 7
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: just-solve
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_just-solve-disambiguated/${now:%Y%m%dT%H%M}
