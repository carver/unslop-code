# Lint rules for the Python here: the bin scripts (no .py extension, so they are listed),
# the tests, report/ and install.py. The ignores are the house style of dense one-liners;
# each names the rule it silences so the list can be revisited.
target-version = "py312"
line-length = 120
extend-include = [
  "bin/ast-rules", "bin/build-prompt", "bin/compare-runs", "bin/failures", "bin/fork-run", "bin/grid",
  "bin/judge-ambiguities", "bin/ledger-row", "bin/miss-report", "bin/miss-signatures", "bin/quality-split", "bin/queue", "bin/reeval",
  "bin/registry-scores", "bin/results", "bin/run-config", "bin/run-recap", "bin/scb-extend", "bin/start-slot", "bin/summarize",
  "bin/test-history", "bin/usage",
]

[lint]
select = ["E", "F", "W", "B", "SIM"]

[lint.per-file-ignores]
# build.py writes HTML rows as f-strings; wrapping them helps nobody.
"report/build.py" = ["E501"]
