# min13-ABDJKMNT-specv1 on mvvault, against spec v1, specs/mvvault/v1/ built by bin/spec-patch. Written by bin/run-config.
# Same agent, model and thinking as every spectest run. Paths are relative to the repo
# root, which bin/queue and bin/scb-extend run from.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/specs/mvvault/v1/problems bin/scb-extend --new configs/runs/min13-ABDJKMNT-specv1-mvvault-opus5.yaml mvvault 6
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/min13-ABDJKMNT.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - mvvault
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_min13-ABDJKMNT-specv1/${now:%Y%m%dT%H%M}
