# anti_slop-specv2 on datagate, against spec v2, specs/datagate/v2/ built by bin/spec-patch. Written by bin/run-config.
# Same agent, model and thinking as every spectest run. Paths are relative to the repo
# root, which bin/queue and bin/scb-extend run from.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/specs/datagate/v2/problems bin/scb-extend --new configs/runs/anti_slop-specv2-datagate-opus5.yaml datagate 7
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: anti_slop
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_anti_slop-specv2/${now:%Y%m%dT%H%M}
