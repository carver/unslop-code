# Minimal-prompt ladder, rung 0, on the DISAMBIGUATED datagate spec: how small can the prompt
# get and still strict-solve? Prompt spectest-min0-tests-first-handsoff; see configs/prompts/spectest-min*.jinja
# for the ladder (min0 = just-solve plus one sentence; each rung adds one rule set; v8A is the
# full prompt that solved 405/405). Same agent, model, thinking and spec patch as v8A.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/problems bin/scb-extend --new configs/runs/spectest-min0-disambiguated-datagate-opus5.yaml datagate 7
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/spectest-min0-tests-first-handsoff.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_spectest-min0-disambiguated/${now:%Y%m%dT%H%M}
