# min9-ABDEFHJKMNOPR-disambiguated on datagate, against the patched spec copy under problems/ (bin/spec-patch). Written by bin/run-config.
# Same agent, model and thinking as every spectest run.
#
#   SCBENCH_PROBLEMS_PATH=$PWD/problems bin/scb-extend --new configs/runs/min9-ABDEFHJKMNOPR-disambiguated-datagate-opus5.yaml datagate 7
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/min9-ABDEFHJKMNOPR.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - datagate
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_min9-ABDEFHJKMNOPR-disambiguated/${now:%Y%m%dT%H%M}
