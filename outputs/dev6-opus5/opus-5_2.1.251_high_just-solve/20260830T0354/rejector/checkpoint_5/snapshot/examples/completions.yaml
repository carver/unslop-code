defaults:
  api_url: "http://localhost:8000"
  model: "meta-llama/llama-3-70b"
  rpm: 60
  api_type: "completions"
  chat_template: "llama3"

tasks:
  gsm8k:
    prompt:
      system: "Solve the math problem step by step. Put your final answer after ####."
      user: "{question}"
    generation:
      scheme: "greedy"
      max_tokens: 512
    evaluation:
      type: "exact_match"
      answer_field: "answer"
      extract: "last_number"
    output_field: "solution"

  mmlu:
    api_type: "completions"
    chat_template: "chatml"
    prompt:
      system: "Answer with the letter of the correct choice."
      user: "{question}"
    generation:
      scheme: "greedy"
    evaluation:
      type: "exact_match"
      answer_field: "answer"
      extract: "letter"
    output_field: "choice"
