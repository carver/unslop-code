# min12-ABDJKMN on mocked_http, against the cached spec (v0). Written by bin/run-config.
# Same agent, model and thinking as every spectest run. Paths are relative to the repo
# root, which bin/queue and bin/scb-extend run from.
#
#   bin/scb-extend --new configs/runs/min12-ABDJKMN-mocked_http-opus5.yaml mocked_http 8
agent: configs/agents/claude_code-2.1.251.yaml
environment: docker-python3.12-uv
prompt: configs/prompts/min12-ABDJKMN.jinja
model:
  provider: claude_code_oauth
  name: opus-5
thinking: high
problems:
  - mocked_http
save_dir: outputs
save_template: spectest/${model.name}_${agent.version}_${thinking}_min12-ABDJKMN/${now:%Y%m%dT%H%M}
